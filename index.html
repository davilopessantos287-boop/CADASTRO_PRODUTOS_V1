
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque - POO</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>Cadastro de Produtos</h1>

        <!-- Formulário de Entrada -->
        <form id="produto-form">
            <div class="form-group">
                <label for="nome">Nome do Produto:</label>
                <input type="text" id="nome" placeholder="Ex. Notebook" required>
            </div>

            <div class="form-group">
                <label for="preco">Preço (R$):</label>
                <input type="number" id="preco" min="0.01" step="0.01" placeholder="Ex. 3500.00" required>
            </div>

            <div class="form-group">
                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" min="1" step="1" placeholder="Ex. 5" required>
            </div>

            <button type="submit" class="btn primary" id="btn-salvar">
                Adicionar Produto
            </button>

            <button type="button" id="cancelar-edicao" hidden>
                Cancelar Edição
            </button>
        </form>

        <!-- Cabeçalho de Ações e Resumo -->
        <div class="resumo-container">
            <h3 id="total-estoque">Total em Estoque: R$ 0,00</h3>
            <button type="button" id="limpar-tabela" class="btn-danger">
                Limpar Tudo
            </button>
        </div>

        <!-- Tabela de Exibição -->
        <table id="tabela-produtos">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço Un.</th>
                    <th>Qtd</th>
                    <th>Subtotal</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody>
                <!-- As linhas serão inseridas pelo JavaScript -->
            </tbody>
        </table>
    </div>

</body>
</html>
